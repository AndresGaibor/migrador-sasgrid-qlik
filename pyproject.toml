[project]
name = "sas-grid-migrator"
version = "0.1.0"
description = "Analizador y asistente de migración por lotes de SAS 9.4 / SAS Grid a planes de construcción para Talend Studio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "networkx>=3.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "typer>=0.12",
    "mcp>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
sgm = "sas_grid_migrator.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sas_grid_migrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/sas_grid_migrator/cli/*" = ["B008"]
